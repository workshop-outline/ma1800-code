<!DOCTYPE html> <!-- Tells the browser this is an HTML5 document -->

<html> <!-- Contains the whole HTML document -->

<head> <!-- Contains information about the webpage -->
  
  <title>MA1800 Demo</title> <!-- Sets the page title shown in the browser tab -->
</head>

<body> <!-- Contains the visible content of the webpage -->

  <!-- Headings -->
  <h1>Headings and Paragraphs</h1>
  <h2>Secondary Header</h2>
  <h6>Tiny Text</h6>

  <!-- A paragraph -->
  <p>
    This is a short paragraph of text. You can write sentences here to fill the page.
  </p>

  <!-- Text styles -->
  <p>
    This is <b>bold text</b>.  
    This is <i>italic text</i>.  
    This is <u>underlined text</u>.
  </p>

</body>

</html>
