<!-- Tells the browser this is an HTML5 document -->
<!DOCTYPE html>

<html lang="en"> <!-- Sets the language of the webpage to English -->

<head> <!-- Contains information about the webpage -->
  <meta charset="UTF-8"> <!-- Ensures text and special characters display correctly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the page scale correctly on different screen sizes -->
  <title>Hello World — HTML Basics</title> <!-- Sets the page title shown in the browser tab -->
</head>

<body> <!-- Contains the visible content of the webpage -->

  <h1>Hello World!</h1> <!-- Main heading -->

  <p>This is my first paragraph.</p> <!-- Paragraph of text -->

</body>

</html>
