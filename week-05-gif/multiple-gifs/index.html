<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- character encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- responsive scaling -->
  <title>Exercise — Multiple GIFs</title>
  <link rel="stylesheet" href="style.css"> <!-- external stylesheet -->
</head> 

<body>
  <!-- 
    #column is a container for multiple GIF images. 
    CSS can be used to control their layout (e.g. stacked, side by side). 
  -->
  <div id="column">
    <!-- First animated GIF -->
    <img 
      src="assets/cars-around-world.gif" 
      alt="Cars around the world animation">

    <!-- Second animated GIF -->
    <img 
      src="assets/yellow-rose.gif" 
      alt="Yellow rose opening animation">
  </div>
</body>
</html>
