<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- character encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- responsive scaling -->
    
  <title>Exercise 3 — Combining Animations</title>
    
  <link rel="stylesheet" href="style.css"> <!-- external stylesheet -->
</head>  

<body>
  <div id="container"> 
    <!-- Static image -->
    <img src="assets/apollo-17.webp" alt="Apollo 17">

    <!-- Animated moving text -->
    <p class="moving">Hello World</p>
    
    <!-- Animated GIF -->
    <p class="image-animation">
      <img src="assets/horse.gif" alt="Animated horse GIF">
    </p>
    
    <!-- Image with its own animation -->
    <p class="frogs-animation">
      <img src="assets/frog.jpg" alt="Frog close-up">
    </p>
  </div>
</body>
</html>
