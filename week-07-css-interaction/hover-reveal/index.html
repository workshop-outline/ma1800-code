<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Reveal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="content">
    <h1>Hover Reveal</h1>
    <p>Move the mouse across the image to reveal another image underneath.</p>

    <div class="image-container">
      <img src="assets/gradient-one.png" alt="Blue and orange gradient">
      <img class="hidden" src="assets/gradient-two.png" alt="Green and purple gradient">
    </div>
  </main>
</body>
</html>
