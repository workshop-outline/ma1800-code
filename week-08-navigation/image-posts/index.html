<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Posts and Captions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Image Posts and Captions</h1>
    <p>Repeat the same HTML structure to build a sequence of image-based posts.</p>
  </header>

  <main id="column">
    <article class="post">
      <img src="assets/image1.webp" alt="Pink cat image">
      <p class="caption">Post one — image and caption.</p>
    </article>

    <article class="post">
      <img src="assets/image2.png" alt="Moon image">
      <p class="caption">Post two — the same structure can be reused.</p>
    </article>

    <article class="post">
      <img src="assets/image3.jpg" alt="Sun image">
      <p class="caption">Post three — change the media and text while keeping the layout.</p>
    </article>
  </main>
</body>
</html>
