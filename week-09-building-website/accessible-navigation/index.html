<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header>
    <h1>Accessible Navigation</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="#image">Image example</a>
      <a href="#links">Link example</a>
    </nav>
  </header>

  <main id="main-content">
    <section id="image">
      <h2>Describe meaningful images</h2>
      <img src="assets/example-image.jpg" alt="Yellow, orange and blue colour gradient">
    </section>

    <section id="links">
      <h2>Write links that make sense</h2>
      <p>
        Instead of writing “click here”, describe the destination:
        <a href="https://developer.mozilla.org/en-US/docs/Web/Accessibility">Read the MDN accessibility overview</a>.
      </p>
    </section>
  </main>
</body>
</html>
