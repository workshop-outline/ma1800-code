<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Responsive Layout</h1>
    <p>Resize the browser window to see the layout change.</p>
  </header>

  <main class="columns">
    <section>
      <h2>Left</h2>
      <p>This column sits beside the other column on a wide screen.</p>
    </section>

    <section>
      <h2>Right</h2>
      <p>On a narrower screen the two sections stack vertically.</p>
    </section>
  </main>
</body>
</html>
